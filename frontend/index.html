<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fuelimage.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FuelTracks — Enterprise Fleet Telematics Platform. Real-time GPS tracking, fuel monitoring, and fleet intelligence." />
    <title>FuelTracks — Enterprise Fleet Intelligence</title>

    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <div id="root">
      <style>
        body { margin: 0; background-color: #0B0F19; font-family: 'Inter', sans-serif; }
        .initial-loader-wrapper {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
        }
        .initial-loader {
          width: 48px;
          height: 48px;
          border: 4px solid rgba(255, 255, 255, 0.1);
          border-left-color: #3B82F6;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-bottom: 24px;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .initial-brand {
          color: white;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: -0.5px;
        }
        
        /* Smooth Leaflet marker movement */
        .animated-marker {
          transition: transform 4s linear;
        }
      </style>
      <div class="initial-loader-wrapper">
        <div class="initial-loader"></div>
        <div class="initial-brand">FuelTracks</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

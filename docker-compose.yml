version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: fueltracks_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fuel
      POSTGRES_DB: fueltracks
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: fueltracks_redis
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  pgdata:
